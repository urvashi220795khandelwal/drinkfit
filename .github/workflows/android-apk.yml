name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Get DrinkFit code
        uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project (SDK 57)
        run: npx --yes create-expo-app@latest drinkfit --template blank-typescript@sdk-57 --yes

      - name: Install libraries
        working-directory: drinkfit
        run: |
          rm -f App.tsx index.ts
          npx expo install expo-router react-native-safe-area-context react-native-screens expo-linking expo-constants expo-status-bar react-native-svg @react-native-async-storage/async-storage expo-secure-store @supabase/supabase-js react-native-url-polyfill
          npx expo install jest-expo jest @types/jest -- --save-dev

      - name: Copy DrinkFit code into project
        run: |
          cd src
          cp -r app components constants hooks lib services utils tests ../drinkfit/
          node scripts/patch-config.js ../drinkfit

      - name: Type check
        working-directory: drinkfit
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: drinkfit
        run: npx jest --ci

      - name: Generate Android project
        working-directory: drinkfit
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: drinkfit/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkFit-apk
          path: drinkfit/android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: drinkfit/android/app/build/outputs/apk/release/app-release.apk
